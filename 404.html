<!DOCTYPE html>
<html lang="en" data-theme="dusk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Erased — NOONFALL</title>
<link rel="icon" href="/noonfall/favicon.svg" type="image/svg+xml" />
<style>
  :root{
    --bg:#07060c; --ink:#f4e9dc; --muted:#a99a9a; --accent:#ff9a5a; --line:rgba(255,235,215,.14);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    display:grid; place-items:center; min-height:100%;
    background:
      radial-gradient(ellipse 60% 50% at 50% 40%, rgba(255,120,60,.16), transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% 110%, rgba(80,30,30,.5), transparent 70%),
      var(--bg);
    color:var(--ink);
    font-family:"Manrope", ui-sans-serif, system-ui, sans-serif;
    text-align:center; padding:32px;
    overflow:hidden;
  }
  .wrap{ position:relative; max-width:560px; animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise{ from{ opacity:0; transform:translateY(16px);} to{ opacity:1; transform:none;} }
  .moon{
    width:88px; height:88px; margin:0 auto 34px; border-radius:50%;
    background:radial-gradient(circle at 36% 32%, #fff6e4, #ffca8a 42%, #b45a32 100%);
    box-shadow:0 0 90px 18px rgba(255,150,90,.28);
    position:relative;
  }
  .moon::after{
    content:""; position:absolute; inset:-46px; border-radius:50%;
    border:1px solid rgba(255,235,215,.12);
  }
  .kicker{ margin:0 0 18px; font-size:9.5px; letter-spacing:.5em; text-transform:uppercase; color:rgba(255,225,200,.66); }
  h1{
    margin:0 0 18px; font-family:"Cormorant Garamond", Georgia, serif;
    font-weight:300; font-size:clamp(40px,8vw,72px); line-height:1.05;
  }
  h1 em{ color:var(--accent); font-style:italic; }
  p{ margin:0 auto 10px; max-width:44ch; color:var(--muted); font-size:13px; line-height:1.9; letter-spacing:.02em; }
  a{
    display:inline-block; margin-top:30px; padding:13px 26px;
    border:1px solid var(--line); border-radius:999px;
    color:var(--ink); text-decoration:none;
    font-size:9.5px; letter-spacing:.32em; text-transform:uppercase;
    transition:border-color .3s, background .3s, transform .3s;
  }
  a:hover{ border-color:var(--accent); background:rgba(255,154,90,.1); transform:translateY(-1px); }
  .tiny{ margin-top:26px; font-size:8px; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,235,215,.28); }
</style>
</head>
<body>
  <main class="wrap">
    <div class="moon" aria-hidden="true"></div>
    <p class="kicker">404 · erased</p>
    <h1>This page was<br /><em>in the light.</em></h1>
    <p>The sun found it before you did. There is nothing here now — only the shape of where it used to be.</p>
    <p>Walk back into the shade. The game is still there.</p>
    <a href="/noonfall/">Return to NOONFALL</a>
    <p class="tiny">only shadow is left</p>
  </main>
</body>
</html>
